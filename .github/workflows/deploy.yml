name: Deploy to Cloudflare Workers

# 主部署链路已切到 Cloudflare Workers Builds（push 到 main 由 CF 自动构建部署），
# 本 workflow 保留为「手动兜底」：只在 Actions 页面点 Run workflow 时执行。
# 若想改回 Actions 自动部署，把下面 push 触发器的注释去掉，并配置 CLOUDFLARE_API_TOKEN。
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 把 secret 转存进 env，step 级 if 才能判断它是否为空
    # （GitHub Actions 的 job 级 if 不能直接使用 secrets 上下文）
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 关键：EJS 必须在构建期预编译（Workers 运行时禁用 eval / new Function）
      - name: Precompile EJS templates
        run: npm run build

      - name: Deploy to Cloudflare Workers
        # 未配置 CLOUDFLARE_API_TOKEN 时跳过，避免每次 push 都红叉
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Hint (token not configured)
        if: env.CF_TOKEN == ''
        run: |
          echo "::warning::未配置 CLOUDFLARE_API_TOKEN，已跳过部署。"
          echo "两种补法："
          echo "  1) GitHub Actions：Settings → Secrets → 新增 CLOUDFLARE_API_TOKEN"
          echo "  2) 更推荐：直接用 Cloudflare Workers Builds 连接本仓库，无需任何 token"
