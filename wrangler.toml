name = "herb-export-site"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages + D1 绑定
# 部署前请先创建 D1 数据库：wrangler d1 create herb_export_site
# 然后把下方 database_id 替换为创建后返回的 id（也可在 CF 控制台 Pages 设置里绑定，名称填 DB）
[[d1_databases]]
binding = "DB"
database_name = "herb_export_site"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
