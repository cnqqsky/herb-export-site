name = "herb-export-site"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 数据库绑定：D1（边缘 SQLite）
[[d1_databases]]
binding = "DB"
database_name = "herb_export_site"
database_id = "8e1efab3-9da9-492c-902e-a6cf7db0074a"

# 静态资源目录（admin.html / css / js / 图片）。
# run_worker_first = true：Worker 先接管请求，再按需用 env.ASSETS 回源静态文件，
# 这样 SSR 路由（/zh/*、/en/*）与静态资源可共存，互不冲突。
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
